name: Publicar no Instagram

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: ["posts/**"]
  workflow_dispatch:
    inputs:
      acao:
        description: "publicar ou verificar"
        default: "publicar"

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar posts aprovados
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.acao }}" = "verificar" ]; then
            python scripts/publicar.py verificar
          else
            python scripts/publicar.py
          fi
      - name: Guardar o que foi publicado
        if: always()
        run: |
          git config user.name "Publicador Plotoon"
          git config user.email "actions@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "Registra posts publicados [skip ci]" && git push)
