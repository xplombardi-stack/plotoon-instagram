name: Posts antigos

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      acao:
        description: "listar ou apagar"
        default: "listar"

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  antigos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Posts antigos
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          ACAO="${{ github.event.inputs.acao }}"
          if [ -z "$ACAO" ]; then ACAO="apagar"; fi
          python scripts/antigos.py "$ACAO"
      - name: Guardar o resultado
        if: always()
        run: |
          git config user.name "Publicador Plotoon"
          git config user.email "actions@users.noreply.github.com"
          git add antigos 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Atualiza posts antigos [skip ci]" && git pull --rebase && git push)
